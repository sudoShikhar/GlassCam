<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Webcam</title>
<link rel="stylesheet" href="main.css">
</head>

<body>

<div class="titlebar">
  <div class="titlebar__drag"></div>
  <div class="titlebar__controls">
    <button class="titlebar__button" id="winMinimize" title="Minimize" aria-label="Minimize">
      <i data-lucide="minus"></i>
    </button>
    <button class="titlebar__button" id="winMaximize" title="Maximize" aria-label="Maximize">
      <i data-lucide="square"></i>
    </button>
    <button class="titlebar__button titlebar__button--danger" id="winClose" title="Close" aria-label="Close">
      <i data-lucide="x"></i>
    </button>
  </div>
</div>

<video id="video" autoplay muted playsinline></video>

<div class="controls">
  <button id="fitToggle" title="Toggle Fit">
    <i data-lucide="maximize"></i>
  </button>
  <button id="zoomButton" title="Scroll to zoom">
    <span id="zoomLabel">1x</span>
  </button>
</div>

<script src="https://unpkg.com/lucide@latest"></script>
<script src="main.js"></script>

</body>
</html>
