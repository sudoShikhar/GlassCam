name: Build & Release

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-linux:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repo (full history)
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: package-lock.json

      - name: Install dependencies
        run: npm install

      - name: Run unit tests
        run: npm test

      - name: Build AppImage
        run: npm run build

      # 🕒 Generate IST timestamp + tag
      - name: Generate tag (IST)
        id: tag
        run: |
          export TZ=Asia/Kolkata
          TAG=$(date +'%Y_%m_%d_%H_%M_%S')
          DISPLAY_TIME=$(date +'%d %b %Y, %H:%M IST')
          echo "TAG=$TAG" >> $GITHUB_OUTPUT
          echo "DISPLAY_TIME=$DISPLAY_TIME" >> $GITHUB_OUTPUT

      # 📦 Rename artifact
      - name: Rename AppImage
        run: |
          mv dist/*.AppImage dist/WebCam-${{ steps.tag.outputs.TAG }}.AppImage

      # 📝 Generate changelog since last release tag
      - name: Generate changelog
        id: changelog
        run: |
          LAST_TAG=$(git describe --tags --abbrev=0 2>/dev/null || echo "")

          if [ -z "$LAST_TAG" ]; then
            LOG=$(git log --pretty=format:"- %s ([%h](https://github.com/${{ github.repository }}/commit/%H))")
          else
            LOG=$(git log ${LAST_TAG}..HEAD --pretty=format:"- %s ([%h](https://github.com/${{ github.repository }}/commit/%H))")
          fi

          {
            echo "CHANGELOG<<EOF"
            echo "### 🆕 Changes"
            echo ""
            echo "$LOG"
            echo ""
            echo "EOF"
          } >> "$GITHUB_OUTPUT"

      # 🚀 Create release
      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.tag.outputs.TAG }}
          name: "Electron Webcam Release #${{ github.run_number }} (${{ steps.tag.outputs.TAG }})"
          body: |
            📷 **Electron Webcam Automated Release**
            🕒 **Built at:** ${{ steps.tag.outputs.DISPLAY_TIME }}

            ${{ steps.changelog.outputs.CHANGELOG }}
          files: dist/WebCam-*.AppImage
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # 🔗 Update "latest" tag pointer
      - name: Update latest tag
        run: |
          git config user.name "github-actions"
          git config user.email "github-actions@github.com"
          git tag -fa latest -m "Update latest tag"
          git push origin latest --force
